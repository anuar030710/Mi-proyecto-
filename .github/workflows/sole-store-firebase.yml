# Publica Soles Store en Firebase Hosting (https://solesstore.web.app) cada vez que
# cambia la carpeta sole-store/ en la rama main. También se puede lanzar a mano
# desde GitHub: Actions → "Publicar Soles Store" → Run workflow.
name: Publicar Soles Store

on:
  push:
    branches: [main]
    paths: ['sole-store/**', '.github/workflows/sole-store-firebase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLESSTORE }}
          projectId: solesstore
          channelId: live
          entryPoint: sole-store
