# Publica la tienda en Firebase Hosting y actualiza las reglas de seguridad
# cada vez que se sube un cambio. Necesita el secreto FIREBASE_SERVICE_ACCOUNT
# (Settings → Secrets and variables → Actions). Ver salma/LEEME.md.
name: Publicar en Firebase

on:
  push:
    branches: [main, claude/jolly-feynman-bgfh77]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar configuración
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT: no se publica."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q "TU-PROYECTO" .firebaserc; then echo "Falta el ID del proyecto en .firebaserc"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q "ADMIN_EMAIL" firestore.rules; then echo "Falta el correo de administradora en firestore.rules"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Publicar página
        if: steps.check.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --non-interactive
      - name: Publicar reglas de seguridad
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15.37.0 deploy --only firestore:rules --non-interactive
