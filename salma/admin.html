<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Inspirato Salma</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🌸%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .adm { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
    .adm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
    .adm h1 { font: 500 26px/1.1 var(--serif); margin: 0; }
    .tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; background: var(--bg); padding: 10px 0; overflow-x: auto; }
    .tabs button { flex: 1; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--rose); color: #fff; font-size: 12px; padding: 0 6px; margin-left: 4px; }
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
    .plist { display: flex; flex-direction: column; gap: 10px; }
    .prow { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; cursor: pointer; border: 0; text-align: left; width: 100%; }
    .prow img { width: 64px; height: 80px; object-fit: cover; border-radius: 10px; background: var(--petal); }
    .prow strong { display: block; font-size: 16px; }
    .prow small { color: var(--ink-soft); display: block; }
    .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--petal); color: var(--rose-deep); white-space: nowrap; }
    .pill.out { background: #f1e9eb; color: var(--ink-soft); }
    .pill.hid { background: #eee; color: #666; }
    .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stock-cell { border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
    .stock-cell b { display: block; margin-bottom: 6px; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 20px; cursor: pointer; }
    .stepper input { width: 56px; height: 40px; text-align: center; border: 1px solid var(--line); border-radius: 10px; font-size: 17px; font-weight: 700; }
    .colors { display: flex; flex-direction: column; gap: 8px; }
    .crow { display: flex; gap: 8px; align-items: center; }
    .crow input[type=color] { width: 46px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .crow input[type=text] { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .small { padding: 10px 14px; font-size: 14px; }
    .danger { color: #b00020; }
    .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .toggle input { width: 22px; height: 22px; accent-color: var(--rose-deep); }
    .photo { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
    .photo img { width: 120px; height: 150px; object-fit: cover; border-radius: 12px; background: var(--petal); }
    .order h3 { margin: 0; font: 600 17px/1.3 var(--sans); }
    .order ul { margin: 8px 0; padding-left: 18px; }
    .order .warn { color: #b00020; font-size: 14px; }
    details summary { cursor: pointer; color: var(--ink-soft); font-size: 14px; }
    details pre { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 10px; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); text-align: center; }
    .toast[hidden] { display: none; }
    .back { border: 0; background: none; color: var(--rose-deep); font-weight: 600; padding: 8px 0; cursor: pointer; font-size: 15px; }
    .center { min-height: 80dvh; display: grid; place-items: center; }
    .login { width: min(400px, 100%); }
  </style>
</head>
<body>
  <main class="adm" id="app">
    <div class="center"><p class="muted">Cargando…</p></div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
