<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo de maquillaje | Soles Store</title>
  <meta name="description" content="Compra labiales, bases, rubores, sombras, máscaras de pestañas, delineadores, iluminadores y brochas. Filtra por marca, precio, tono y tipo de piel.">
  <meta name="theme-color" content="#F2DAD7">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/pages/catalog.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="app-header"></div>

  <main id="main">
    <div class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="Ruta de navegación"><ol><li><a href="index.html">Inicio</a></li><li aria-current="page">Catálogo</li></ol></nav>
        <h1 id="page-title" style="margin:0">Catálogo</h1>
      </div>
    </div>

    <div class="container catalog">
      <aside class="filters" aria-label="Filtros de productos">
        <form id="filters-form"></form>
      </aside>

      <section aria-labelledby="page-title">
        <div class="toolbar">
          <button class="btn btn--outline btn--sm filters-toggle" aria-expanded="false">Filtros</button>
          <p id="result-count" class="muted" role="status" aria-live="polite" style="margin:0"></p>
          <label class="small" style="display:flex;gap:8px;align-items:center">
            <span>Ordenar por</span>
            <select id="sort">
              <option value="relevancia">Relevancia</option>
              <option value="vendidos">Más vendidos</option>
              <option value="novedades">Novedades</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="calificacion">Mejor calificados</option>
            </select>
          </label>
        </div>
        <div class="active-filters" id="active-filters"></div>
        <div class="product-grid" id="grid"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
